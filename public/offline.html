<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Even geen internet – Foodlo</title>
    <!--
      Offline-scherm (ronde 3, MOBILE_ARCHITECTURE M3). Getoond door de service worker als een pagina
      niet geladen kan worden, en door de app (Capacitor server.errorPath) als de website niet laadt.
      Volledig zelfstandig: geen lettertypes, scripts of afbeeldingen van buiten.
    -->
    <style>
      :root {
        --bg: #faf6ef;
        --kaart: #ffffff;
        --inkt: #1b3a2d;
        --tekst: #1d2621;
        --zacht: #5d6a63;
        --groen: #22573f;
        --op-groen: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111814;
          --kaart: #19221d;
          --inkt: #0c1a13;
          --tekst: #e7ece8;
          --zacht: #a7b3ad;
          --groen: #7cc29c;
          --op-groen: #0c1a13;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { font-size: 112.5%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--tekst);
        font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--kaart);
        border-radius: 1.5rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
      }
      .logo { font-size: 2.5rem; line-height: 1; }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.8rem;
        line-height: 1.2;
        margin: 1rem 0 0.5rem;
        overflow-wrap: break-word;
      }
      p { margin: 0 0 1rem; color: var(--zacht); }
      ul { margin: 0 0 1.25rem; padding-left: 1.2rem; color: var(--zacht); }
      li { margin: 0.25rem 0; }
      button, a.knop {
        display: flex;
        width: 100%;
        min-height: 3.5rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      button { background: var(--groen); color: var(--op-groen); }
      a.knop { margin-top: 0.75rem; background: transparent; color: var(--tekst); border: 2px solid currentColor; }
      button:focus-visible, a.knop:focus-visible { outline: 3px solid #d79a2b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">🍲</div>
      <h1>Even geen internet</h1>
      <p>Foodlo kan deze pagina nu niet laden. Er is niets verloren gegaan.</p>
      <ul>
        <li>Je boodschappenlijst en klantenkaarten werken ook offline, als je ze eerder opende.</li>
        <li>Wat je afvinkt zonder internet, wordt bewaard zodra je weer verbinding hebt.</li>
      </ul>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
      <a class="knop" href="/boodschappen">Naar mijn lijst</a>
    </main>
  </body>
</html>
