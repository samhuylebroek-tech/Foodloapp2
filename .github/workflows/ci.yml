# Foodloapp V2 — kwaliteitscontrole. Bouwt en test alleen; deployt nooit.
name: CI

on:
  push:
    branches: ["v2/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Lint (alleen nieuwe of gewijzigde bestanden)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" -- '*.ts' '*.tsx' | grep -v '^src/routeTree.gen.ts$' || true)
          if [ -n "$FILES" ]; then bunx eslint $FILES; fi
      - name: Build (lokaal, geen deploy)
        run: bun run build
